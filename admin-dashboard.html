<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPC Store — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff2244;--cyan:#00f0ff;--green:#00e676;
  --gold:#ffd600;--purple:#bf5fff;--orange:#ff6b00;--bg:#03070d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding:14px 14px 40px;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-grad{position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,100,255,.15),transparent 70%),
  radial-gradient(ellipse 60% 40% at 20% 80%,rgba(255,34,68,.1),transparent 60%),
  linear-gradient(180deg,#03070d 0%,#060f18 50%,#050d0a 100%);}

/* LOCK SCREEN */
#lockScreen{
  position:fixed;inset:0;z-index:9999;
  background:rgba(3,7,13,.98);
  display:flex;align-items:center;justify-content:center;
}
.lock-box{
  background:#060d18;border:1px solid rgba(0,240,255,.3);
  border-radius:20px;padding:32px 28px;width:90%;max-width:340px;
  box-shadow:0 0 40px rgba(0,240,255,.12);
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
.lock-icon{font-size:44px;text-align:center;display:block;margin-bottom:14px;}
.lock-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;
  letter-spacing:2px;text-align:center;margin-bottom:4px;
  background:linear-gradient(90deg,#00f0ff,#bf5fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.lock-sub{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.3);text-align:center;margin-bottom:20px;}
.lock-inp-wrap{position:relative;margin-bottom:10px;}
.lock-inp{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(0,240,255,.25);border-radius:12px;
  padding:13px 44px 13px 16px;font-family:'Orbitron',monospace;font-size:16px;font-weight:700;
  color:#fff;outline:none;letter-spacing:5px;caret-color:var(--cyan);transition:border-color .2s;}
.lock-inp:focus{border-color:rgba(0,240,255,.6);box-shadow:0 0 0 3px rgba(0,240,255,.1);}
.lock-inp.err{border-color:rgba(255,34,68,.7)!important;animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.lock-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:16px;}
.lock-err{font-family:'Orbitron',monospace;font-size:9px;color:var(--red);text-align:center;display:none;margin-bottom:8px;}
.lock-err.show{display:block;}
.lock-btn{width:100%;padding:13px;border:none;border-radius:12px;
  font-family:'Orbitron',monospace;font-size:11px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,#00f0ff,#bf5fff);color:#000;
  transition:transform .15s,box-shadow .15s;letter-spacing:1px;}
.lock-btn:hover{transform:scale(1.03);box-shadow:0 6px 24px rgba(0,240,255,.4);}
.lock-btn:active{transform:scale(.97);}

/* MAIN */
.main{position:relative;z-index:1;max-width:520px;margin:0 auto;}

/* HEADER */
.dash-header{text-align:center;padding:14px 0 18px;}
.dash-logo{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,#ff2244,#ff6b00,#ffd600,#00e676,#00f0ff,#bf5fff,#ff2244);
  background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:gshift 4s linear infinite;}
@keyframes gshift{from{background-position:0% 50%;}to{background-position:300% 50%;}}
.dash-sub{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:4px;color:rgba(0,240,255,.5);margin-top:4px;}
.dash-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,240,255,.4),rgba(255,214,0,.5),transparent);margin:10px 0 18px;}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:rgba(0,240,255,.05);border:1px solid rgba(0,240,255,.15);border-radius:14px;padding:12px 10px;text-align:center;}
.stat-card.red{background:rgba(255,34,68,.05);border-color:rgba(255,34,68,.2);}
.stat-card.green{background:rgba(0,230,118,.05);border-color:rgba(0,230,118,.2);}
.stat-num{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;line-height:1;}
.stat-card:not(.red):not(.green) .stat-num{color:var(--cyan);}
.stat-card.red .stat-num{color:var(--red);}
.stat-card.green .stat-num{color:var(--green);}
.stat-lbl{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.3);margin-top:4px;}

/* FILTER BAR */
.filter-bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid;background:none;transition:background .15s,color .15s;letter-spacing:1px;}
.filter-btn[data-f="all"]{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.15);}
.filter-btn[data-f="all"].active,.filter-btn[data-f="all"]:hover{background:rgba(255,255,255,.1);color:#fff;}
.filter-btn[data-f="pending"]{color:var(--gold);border-color:rgba(255,214,0,.3);}
.filter-btn[data-f="pending"].active,.filter-btn[data-f="pending"]:hover{background:rgba(255,214,0,.12);}
.filter-btn[data-f="done"]{color:var(--green);border-color:rgba(0,230,118,.3);}
.filter-btn[data-f="done"].active,.filter-btn[data-f="done"]:hover{background:rgba(0,230,118,.1);}
.filter-btn[data-f="cancel"]{color:var(--red);border-color:rgba(255,34,68,.3);}
.filter-btn[data-f="cancel"].active,.filter-btn[data-f="cancel"]:hover{background:rgba(255,34,68,.1);}
.filter-right{margin-left:auto;font-family:'Orbitron',monospace;font-size:8px;color:rgba(255,255,255,.25);padding:5px 0;letter-spacing:1px;display:flex;align-items:center;gap:5px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.7);}}

/* ORDER CARDS */
.order-list{display:flex;flex-direction:column;gap:10px;}
.order-card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:14px;
  animation:fadeUp .4s ease both;
  position:relative;overflow:hidden;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.order-card.pending{border-color:rgba(255,214,0,.25);background:rgba(255,214,0,.03);}
.order-card.done{border-color:rgba(0,230,118,.25);background:rgba(0,230,118,.03);}
.order-card.cancel{border-color:rgba(255,34,68,.2);background:rgba(255,34,68,.02);opacity:.7;}
.order-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;
}
.order-card.pending::before{background:var(--gold);}
.order-card.done::before{background:var(--green);}
.order-card.cancel::before{background:var(--red);}

.order-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;}
.order-id-wrap{display:flex;flex-direction:column;gap:2px;}
.order-id{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;color:var(--cyan);letter-spacing:1px;}
.order-time{font-family:'Orbitron',monospace;font-size:7px;color:rgba(255,255,255,.28);letter-spacing:1px;}
.order-usn{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--purple);margin-top:1px;}
.status-badge{font-family:'Orbitron',monospace;font-size:7px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;letter-spacing:1px;}
.status-badge.pending{background:rgba(255,214,0,.15);color:var(--gold);border:1px solid rgba(255,214,0,.4);}
.status-badge.done{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.4);}
.status-badge.cancel{background:rgba(255,34,68,.12);color:#ff6680;border:1px solid rgba(255,34,68,.3);}

.order-items{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.order-item-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.order-item-row:last-child{border-bottom:none;}
.item-label{display:flex;align-items:center;gap:6px;}
.item-tag{font-family:'Orbitron',monospace;font-size:7px;font-weight:700;padding:1px 5px;border-radius:10px;}
.item-tag.gp{background:rgba(255,34,68,.15);color:var(--red);}
.item-tag.cash{background:rgba(0,240,255,.12);color:var(--cyan);}
.item-nm{color:rgba(255,255,255,.8);}
.item-qty{font-family:'Orbitron',monospace;font-size:10px;color:rgba(255,255,255,.4);}
.item-price{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--gold);}

.order-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.order-total-wrap{display:flex;flex-direction:column;gap:1px;}
.total-lbl{font-family:'Orbitron',monospace;font-size:7px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.total-amt{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--green);}
.total-amt .curr{font-size:10px;vertical-align:super;color:rgba(255,255,255,.4);margin-right:1px;}
.order-admin{font-family:'Orbitron',monospace;font-size:8px;color:rgba(255,255,255,.3);letter-spacing:1px;text-align:right;}

.action-row{display:flex;gap:6px;margin-top:10px;}
.act-btn{flex:1;padding:7px 4px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;cursor:pointer;transition:transform .15s,opacity .15s;letter-spacing:.5px;}
.act-btn:active{transform:scale(.96);}
.act-btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-done{background:linear-gradient(135deg,#00c853,#00e676);color:#003311;}
.btn-done:not(:disabled):hover{box-shadow:0 4px 16px rgba(0,200,100,.4);}
.btn-cancel{background:rgba(255,34,68,.15);color:#ff6680;border:1px solid rgba(255,34,68,.25);}
.btn-cancel:not(:disabled):hover{background:rgba(255,34,68,.25);}
.btn-del{background:rgba(80,80,80,.2);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.1);}
.btn-del:not(:disabled):hover{background:rgba(255,34,68,.12);color:var(--red);border-color:rgba(255,34,68,.3);}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.18);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);padding:9px 22px;border-radius:30px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;}
.toast.warn{background:rgba(255,200,0,.97);color:#1a0d00;}
.toast.ok{background:rgba(0,230,118,.97);color:#003311;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* LOGOUT BTN */
.logout-btn{
  position:fixed;top:12px;right:12px;z-index:100;
  font-family:'Orbitron',monospace;font-size:8px;font-weight:700;
  padding:6px 12px;border-radius:20px;border:1px solid rgba(255,34,68,.3);
  background:rgba(255,34,68,.08);color:rgba(255,100,120,.7);cursor:pointer;
  letter-spacing:1px;transition:background .2s,color .2s;
}
.logout-btn:hover{background:rgba(255,34,68,.18);color:#ff6680;}
/* ANNOUNCE EDITOR */
.announce-editor{background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.15);border-radius:16px;padding:14px;margin-bottom:14px;}
.announce-lbl{font-family:'Orbitron',monospace;font-size:9px;color:rgba(0,240,255,.6);letter-spacing:1px;margin-bottom:8px;}
.announce-inp{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(0,240,255,.2);border-radius:10px;padding:9px 12px;font-family:'Rajdhani',sans-serif;font-size:13px;color:#fff;outline:none;resize:none;margin-bottom:8px;}
.announce-save{width:100%;padding:10px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,rgba(0,240,255,.2),rgba(0,240,255,.1));color:var(--cyan);border:1px solid rgba(0,240,255,.3);letter-spacing:1px;}
.announce-save:hover{background:rgba(0,240,255,.2);}
/* LEADERBOARD EDITOR */
.lb-editor{background:rgba(255,214,0,.04);border:1px solid rgba(255,214,0,.2);border-radius:16px;padding:14px;margin-bottom:14px;}
.lb-editor-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.lb-editor-ttl{font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,214,0,.7);letter-spacing:1px;}
.lb-editor-add{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,214,0,.3);background:rgba(255,214,0,.1);color:var(--gold);cursor:pointer;letter-spacing:.5px;}
.lb-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:280px;overflow-y:auto;}
.lb-row{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 10px;}
.lb-row-rank{font-family:'Orbitron',monospace;font-size:11px;color:rgba(255,255,255,.3);width:20px;text-align:center;flex-shrink:0;}
.lb-row-inp{flex:1;background:transparent;border:none;color:#fff;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;}
.lb-row-rb{width:60px;background:transparent;border:none;color:var(--gold);font-family:'Orbitron',monospace;font-size:10px;outline:none;text-align:right;}
.lb-row-del{background:none;border:none;color:rgba(255,34,68,.4);cursor:pointer;font-size:14px;flex-shrink:0;padding:0 2px;}
.lb-row-del:hover{color:var(--red);}
.lb-mode-row{display:flex;gap:8px;margin-bottom:10px;}
.lb-mode-btn{flex:1;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:7px;border-radius:10px;cursor:pointer;border:1px solid;letter-spacing:.5px;transition:background .15s;}
.lb-mode-btn.auto{color:var(--cyan);border-color:rgba(0,240,255,.3);background:rgba(0,240,255,.05);}
.lb-mode-btn.auto.active{background:rgba(0,240,255,.15);}
.lb-mode-btn.manual{color:var(--gold);border-color:rgba(255,214,0,.3);background:rgba(255,214,0,.05);}
.lb-mode-btn.manual.active{background:rgba(255,214,0,.15);}
.lb-save{width:100%;padding:10px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,rgba(255,214,0,.2),rgba(255,140,0,.2));color:var(--gold);border:1px solid rgba(255,214,0,.3);letter-spacing:1px;}

/* THEME EDITOR */
.theme-editor{background:rgba(191,95,255,.05);border:1px solid rgba(191,95,255,.2);border-radius:16px;padding:14px;margin-bottom:14px;}
.theme-ttl{font-family:'Orbitron',monospace;font-size:9px;color:rgba(191,95,255,.7);letter-spacing:1px;margin-bottom:10px;display:block;}
.theme-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.theme-preset{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.theme-preset:hover{transform:scale(1.15);}
.theme-preset.active{border-color:#fff;transform:scale(1.15);}
.theme-colors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.color-row{display:flex;flex-direction:column;gap:3px;}
.color-lbl{font-family:'Orbitron',monospace;font-size:7px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.color-inp-row{display:flex;align-items:center;gap:6px;}
.color-picker{width:32px;height:28px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0;}
.color-hex{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 8px;font-family:'Orbitron',monospace;font-size:9px;color:#fff;outline:none;}
.theme-save{width:100%;padding:10px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,rgba(191,95,255,.2),rgba(100,50,255,.2));color:var(--purple);border:1px solid rgba(191,95,255,.3);letter-spacing:1px;}
.theme-reset{width:100%;padding:8px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:8px;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);margin-top:6px;letter-spacing:1px;}

/* CATATAN ORDER */
.note-wrap{margin-top:8px;}
.note-inp{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;font-family:'Rajdhani',sans-serif;font-size:12px;color:#fff;outline:none;resize:none;}
.note-inp::placeholder{color:rgba(255,255,255,.2);}
.note-save-btn{margin-top:5px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid rgba(0,240,255,.3);background:rgba(0,240,255,.08);color:var(--cyan);cursor:pointer;width:100%;}
.note-saved{font-family:'Orbitron',monospace;font-size:7px;color:var(--green);margin-top:3px;text-align:center;display:none;}
.has-note::after{content:'📝';font-size:10px;margin-left:4px;}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <span class="lock-icon">🔐</span>
    <div class="lock-title">ADMIN DASHBOARD</div>
    <div class="lock-sub">KPC STORE — MASUKKAN PASSWORD</div>
    <div class="lock-inp-wrap">
      <input class="lock-inp" id="lockPass" type="password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doUnlock()" autocomplete="off"/>
      <button class="lock-eye" id="lockEye" onclick="toggleLockEye()">👁</button>
    </div>
    <div class="lock-err" id="lockErr">⚠️ PASSWORD SALAH!</div>
    <button class="lock-btn" onclick="doUnlock()">🔓 MASUK DASHBOARD</button>
  </div>
</div>

<button class="logout-btn" onclick="doLogout()">⏻ LOGOUT</button>

<div class="bg"><div class="bg-grad"></div></div>

<div class="main" id="mainDash" style="display:none;">

  <!-- HEADER -->
  <div class="dash-header">
    <div class="dash-logo">KPC</div>
    <div class="dash-sub">ADMIN DASHBOARD — ORDER MONITOR</div>
    <div class="dash-divider"></div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-lbl">TOTAL ORDER</div>
    </div>
    <div class="stat-card red">
      <div class="stat-num" id="statPending">0</div>
      <div class="stat-lbl">PENDING</div>
    </div>
    <div class="stat-card green">
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-lbl">SELESAI</div>
    </div>
  </div>

  <!-- ANNOUNCEMENT EDITOR -->
  <div class="announce-editor">
    <div class="announce-lbl">📢 EDIT PENGUMUMAN TOKO</div>
    <textarea class="announce-inp" id="announceInp" rows="2" placeholder="Tulis pengumuman..."></textarea>
    <button class="announce-save" onclick="saveAnnounce()">💾 SIMPAN PENGUMUMAN</button>
  </div>

  <!-- LEADERBOARD EDITOR -->
  <div class="lb-editor">
    <div class="lb-editor-hdr">
      <span class="lb-editor-ttl">🏆 ATUR TOP PEMBELI</span>
      <button class="lb-editor-add" onclick="lbAddRow()">+ TAMBAH</button>
    </div>
    <div class="lb-mode-row">
      <button class="lb-mode-btn auto active" id="lbModeAuto" onclick="setLbMode('auto')">🔄 AUTO (dari order)</button>
      <button class="lb-mode-btn manual" id="lbModeManual" onclick="setLbMode('manual')">✏️ MANUAL (custom)</button>
    </div>
    <div class="lb-rows" id="lbEditorRows">
      <div style="font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,255,255,.2);text-align:center;padding:10px;">Loading...</div>
    </div>
    <button class="lb-save" onclick="saveLb()">💾 SIMPAN LEADERBOARD</button>
  </div>

  <!-- TEMA WARNA -->
  <div class="theme-editor">
    <span class="theme-ttl">🎨 GANTI TEMA WARNA TOKO</span>
    <div class="theme-presets" id="themePresets">
      <div class="theme-preset active" data-theme="default" style="background:linear-gradient(135deg,#ff2244,#00f0ff)" onclick="applyPreset('default')" title="Default"></div>
      <div class="theme-preset" data-theme="sunset" style="background:linear-gradient(135deg,#ff6b00,#ffd600)" onclick="applyPreset('sunset')" title="Sunset"></div>
      <div class="theme-preset" data-theme="ocean" style="background:linear-gradient(135deg,#0066ff,#00e676)" onclick="applyPreset('ocean')" title="Ocean"></div>
      <div class="theme-preset" data-theme="sakura" style="background:linear-gradient(135deg,#ff69b4,#bf5fff)" onclick="applyPreset('sakura')" title="Sakura"></div>
      <div class="theme-preset" data-theme="toxic" style="background:linear-gradient(135deg,#00e676,#ffd600)" onclick="applyPreset('toxic')" title="Toxic"></div>
      <div class="theme-preset" data-theme="midnight" style="background:linear-gradient(135deg,#1a0533,#bf5fff)" onclick="applyPreset('midnight')" title="Midnight"></div>
    </div>
    <div class="theme-colors">
      <div class="color-row">
        <span class="color-lbl">AKSEN MERAH</span>
        <div class="color-inp-row">
          <input type="color" class="color-picker" id="tc-red" value="#ff2244" oninput="syncHex('red',this.value)"/>
          <input class="color-hex" id="th-red" value="#ff2244" maxlength="7" oninput="syncPicker('red',this.value)"/>
        </div>
      </div>
      <div class="color-row">
        <span class="color-lbl">AKSEN CYAN</span>
        <div class="color-inp-row">
          <input type="color" class="color-picker" id="tc-cyan" value="#00f0ff" oninput="syncHex('cyan',this.value)"/>
          <input class="color-hex" id="th-cyan" value="#00f0ff" maxlength="7" oninput="syncPicker('cyan',this.value)"/>
        </div>
      </div>
      <div class="color-row">
        <span class="color-lbl">AKSEN HIJAU</span>
        <div class="color-inp-row">
          <input type="color" class="color-picker" id="tc-green" value="#00e676" oninput="syncHex('green',this.value)"/>
          <input class="color-hex" id="th-green" value="#00e676" maxlength="7" oninput="syncPicker('green',this.value)"/>
        </div>
      </div>
      <div class="color-row">
        <span class="color-lbl">AKSEN GOLD</span>
        <div class="color-inp-row">
          <input type="color" class="color-picker" id="tc-gold" value="#ffd600" oninput="syncHex('gold',this.value)"/>
          <input class="color-hex" id="th-gold" value="#ffd600" maxlength="7" oninput="syncPicker('gold',this.value)"/>
        </div>
      </div>
    </div>
    <button class="theme-save" onclick="saveTheme()">🎨 TERAPKAN TEMA</button>
    <button class="theme-reset" onclick="resetTheme()">↺ RESET KE DEFAULT</button>
  </div>

  <!-- FILTER -->
  <div class="filter-bar">
    <button class="filter-btn active" data-f="all" onclick="setFilter('all',this)">SEMUA</button>
    <button class="filter-btn" data-f="pending" onclick="setFilter('pending',this)">⏳ PENDING</button>
    <button class="filter-btn" data-f="done" onclick="setFilter('done',this)">✅ SELESAI</button>
    <button class="filter-btn" data-f="cancel" onclick="setFilter('cancel',this)">❌ BATAL</button>
    <div class="filter-right"><span class="live-dot"></span>LIVE</div>
  </div>

  <!-- ORDER LIST -->
  <div class="order-list" id="orderList">
    <div class="empty-state">⏳ LOADING ORDERS...</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const PASS = 'kpc2025';

const app = initializeApp({
  apiKey:"AIzaSyC8iPr3Ww5K9NLUtOmytto0sKjWu8Zr28o",
  authDomain:"testimoni-33abd.firebaseapp.com",
  projectId:"testimoni-33abd",
  storageBucket:"testimoni-33abd.firebasestorage.app",
  messagingSenderId:"499376066418",
  appId:"1:499376066418:web:a082972e7c4f70f64657eb"
});
const db = getFirestore(app);
const orderCol = collection(db, "orders");

let allOrders = [];
let currentFilter = 'all';
let unsubscribe = null;

/* ══ LOCK / UNLOCK ══ */
window.doUnlock = function(){
  const inp = document.getElementById('lockPass');
  const err = document.getElementById('lockErr');
  if(inp.value === PASS){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainDash').style.display = 'block';
    startListener();
  } else {
    inp.classList.add('err');
    err.classList.add('show');
    inp.value = '';
    setTimeout(()=>inp.classList.remove('err'),500);
  }
};

window.toggleLockEye = function(){
  const i = document.getElementById('lockPass');
  const e = document.getElementById('lockEye');
  i.type = i.type === 'password' ? 'text' : 'password';
  e.textContent = i.type === 'password' ? '👁' : '🙈';
};

window.doLogout = function(){
  if(unsubscribe) unsubscribe();
  document.getElementById('mainDash').style.display = 'none';
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockPass').value = '';
};

/* ══ LISTENER ══ */
function startListener(){
  const q = query(orderCol, orderBy("createdAt","desc"));
  unsubscribe = onSnapshot(q, snap => {
    allOrders = [];
    snap.forEach(d => allOrders.push({id: d.id, ...d.data()}));
    updateStats();
    renderOrders();
  });
}

function updateStats(){
  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statPending').textContent = allOrders.filter(o=>o.status==='pending').length;
  document.getElementById('statDone').textContent = allOrders.filter(o=>o.status==='done').length;
}

/* ══ FILTER ══ */
window.setFilter = function(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
};

/* ══ RENDER ══ */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderOrders(){
  const list = document.getElementById('orderList');
  list.innerHTML = '';

  const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o=>o.status===currentFilter);

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-state">📭 TIDAK ADA ORDER DI KATEGORI INI</div>';
    return;
  }

  filtered.forEach((order,idx) => {
    const card = document.createElement('div');
    card.className = 'order-card ' + (order.status||'pending');
    card.style.animationDelay = (idx*0.05)+'s';

    const items = order.items || [];
    const itemsHtml = items.map(it => `
      <div class="order-item-row">
        <div class="item-label">
          <span class="item-tag ${it.panel==='gp'?'gp':'cash'}">${it.panel==='gp'?'GP':'CASH'}</span>
          <span class="item-nm">${esc(it.nama)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="item-qty">x${it.qty||1}</span>
          <span class="item-price">${(it.harga||0)*(it.qty||1)}rb</span>
        </div>
      </div>`).join('');

    const isDone = order.status === 'done';
    const isCancel = order.status === 'cancel';
    const statusLabel = isDone ? '✅ SELESAI' : isCancel ? '❌ BATAL' : '⏳ PENDING';

    card.innerHTML = `
      <div class="order-top">
        <div class="order-id-wrap">
          <div class="order-id">🧾 #${esc(order.orderId||order.id.slice(-6).toUpperCase())}</div>
          <div class="order-time">🕐 ${esc(order.tStr||'-')}</div>
          <div class="order-usn">🎮 ${esc(order.usn||'-')}</div>
        </div>
        <span class="status-badge ${order.status||'pending'}">${statusLabel}</span>
      </div>
      <div class="order-items">${itemsHtml}</div>
      <div class="order-footer">
        <div class="order-total-wrap">
          <div class="total-lbl">TOTAL SEHARUSNYA</div>
          <div class="total-amt"><span class="curr">Rp</span>${(order.totalRb||0).toLocaleString('id-ID')}.000</div>
        </div>
        <div class="order-admin">Admin<br>${esc(order.admin||'-')}</div>
      </div>
      <div class="action-row">
        <button class="act-btn btn-done" ${isDone?'disabled':''} onclick="setStatus('${order.id}','done')">✅ SELESAI</button>
        <button class="act-btn btn-cancel" ${isCancel?'disabled':''} onclick="setStatus('${order.id}','cancel')">❌ BATAL</button>
        <button class="act-btn btn-del" onclick="delOrder('${order.id}')">🗑</button>
      </div>
      <div class="note-wrap">
        <textarea class="note-inp" id="note-${order.id}" rows="1" placeholder="📝 Tulis catatan admin..." onchange="saveNote('${order.id}',this.value)">${order.note||''}</textarea>
      </div>`;

    list.appendChild(card);
  });
}

/* ══ ANNOUNCE ══ */
window.saveAnnounce = async function(){
  const text = document.getElementById('announceInp').value.trim();
  if(!text){ toast('⚠️ Isi pengumuman dulu!','warn'); return; }
  try{
    const {doc, setDoc} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    await setDoc(doc(db,'config','announcement'),{text});
    toast('✅ Pengumuman disimpan!','ok');
  }catch(e){ toast('❌ Gagal simpan!','warn'); }
};

// Load existing announcement
(async()=>{
  try{
    const {doc, getDoc} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const snap = await getDoc(doc(db,'config','announcement'));
    if(snap.exists()){
      const el=document.getElementById('announceInp');
      if(el) el.value=snap.data().text||'';
    }
  }catch(e){}
})();

/* ══ LEADERBOARD EDITOR ══ */
let lbMode = 'auto';
let lbData = [];

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

window.setLbMode = function(mode){
  lbMode = mode;
  document.getElementById('lbModeAuto').classList.toggle('active', mode==='auto');
  document.getElementById('lbModeManual').classList.toggle('active', mode==='manual');
  if(mode==='auto') loadLbFromOrders();
  else renderLbEditor();
};

function loadLbFromOrders(){
  const map={};
  allOrders.forEach(o=>{
    if(!o.usn||o.status!=='done') return;
    const k=o.usn.toLowerCase();
    if(!map[k]) map[k]={usn:o.usn,totalRb:0,count:0};
    map[k].totalRb+=(o.totalRb||0);
    map[k].count++;
  });
  lbData = Object.values(map).sort((a,b)=>b.totalRb-a.totalRb).slice(0,10)
    .map(u=>({usn:u.usn,totalRb:u.totalRb}));
  renderLbEditor();
}

function renderLbEditor(){
  const container = document.getElementById('lbEditorRows');
  if(!container) return;
  container.innerHTML = '';
  if(lbData.length===0){
    container.innerHTML='<div style="font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,255,255,.2);text-align:center;padding:10px;">Belum ada data</div>';
    return;
  }
  lbData.forEach((item,i)=>{
    const row = document.createElement('div');
    row.className = 'lb-row';
    row.innerHTML =
      '<span class="lb-row-rank">'+(i+1)+'</span>'+
      '<input class="lb-row-inp" value="'+escH(item.usn)+'" placeholder="Username..." oninput="lbData['+i+'].usn=this.value"/>'+
      '<input class="lb-row-rb" type="number" value="'+(item.totalRb||0)+'" placeholder="0" oninput="lbData['+i+'].totalRb=+this.value"/>'+
      '<span style="font-family:'Orbitron',monospace;font-size:8px;color:rgba(255,255,255,.3)">rb</span>'+
      '<button class="lb-row-del" onclick="lbDeleteRow('+i+')">🗑</button>';
    container.appendChild(row);
  });
}

window.lbAddRow = function(){
  lbData.push({usn:'',totalRb:0});
  renderLbEditor();
};

window.lbDeleteRow = function(i){
  lbData.splice(i,1);
  renderLbEditor();
};

window.saveLb = async function(){
  try{
    const {doc, setDoc} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    await setDoc(doc(db,'config','leaderboard'),{mode:lbMode,data:lbData,updatedAt:new Date().toISOString()});
    toast('✅ Leaderboard disimpan!','ok');
  }catch(e){ toast('❌ Gagal simpan: '+e.message,'warn'); }
};

// Load lb config on start
(async()=>{
  try{
    const {doc, getDoc} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const snap = await getDoc(doc(db,'config','leaderboard'));
    if(snap.exists()){
      const d = snap.data();
      lbMode = d.mode||'auto';
      lbData = d.data||[];
      document.getElementById('lbModeAuto').classList.toggle('active', lbMode==='auto');
      document.getElementById('lbModeManual').classList.toggle('active', lbMode==='manual');
      renderLbEditor();
    } else {
      loadLbFromOrders();
    }
  }catch(e){ loadLbFromOrders(); }
})();

/* ══ TEMA WARNA ══ */
const PRESETS = {
  default: {red:'#ff2244',cyan:'#00f0ff',green:'#00e676',gold:'#ffd600',purple:'#bf5fff',bg:'#03070d'},
  sunset:  {red:'#ff6b00',cyan:'#ffd600',green:'#ffaa00',gold:'#ff4400',purple:'#ff69b4',bg:'#0d0500'},
  ocean:   {red:'#0066ff',cyan:'#00cfff',green:'#00e676',gold:'#00b4ff',purple:'#6688ff',bg:'#000d1a'},
  sakura:  {red:'#ff69b4',cyan:'#ffb3d9',green:'#ff85c2',gold:'#ffaadd',purple:'#bf5fff',bg:'#0d0008'},
  toxic:   {red:'#aaff00',cyan:'#00e676',green:'#ccff33',gold:'#ffd600',purple:'#88ff44',bg:'#010d00'},
  midnight:{red:'#bf5fff',cyan:'#9933ff',green:'#cc66ff',gold:'#bf5fff',purple:'#7700cc',bg:'#0a0015'},
};

window.applyPreset = function(name){
  const t = PRESETS[name];
  if(!t) return;
  document.querySelectorAll('.theme-preset').forEach(el=>el.classList.toggle('active',el.dataset.theme===name));
  ['red','cyan','green','gold'].forEach(k=>{
    const pc=document.getElementById('tc-'+k);
    const ph=document.getElementById('th-'+k);
    if(pc) pc.value=t[k];
    if(ph) ph.value=t[k];
  });
};

window.syncHex = function(k,v){ const el=document.getElementById('th-'+k); if(el) el.value=v; };
window.syncPicker = function(k,v){ if(/^#[0-9a-fA-F]{6}$/.test(v)){ const el=document.getElementById('tc-'+k); if(el) el.value=v; } };

window.saveTheme = async function(){
  const t={};
  ['red','cyan','green','gold'].forEach(k=>{
    const v=document.getElementById('th-'+k)?.value;
    if(v) t[k]=v;
  });
  try{
    const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    await setDoc(doc(db,'config','theme'),t);
    toast('🎨 Tema berhasil diterapkan!','ok');
  }catch(e){ toast('❌ Gagal simpan tema','warn'); }
};

window.resetTheme = async function(){
  try{
    const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    await setDoc(doc(db,'config','theme'),PRESETS.default);
    applyPreset('default');
    toast('↺ Tema direset ke default','ok');
  }catch(e){ toast('❌ Gagal reset','warn'); }
};

// Load current theme
(async()=>{
  try{
    const {doc,getDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const snap=await getDoc(doc(db,'config','theme'));
    if(snap.exists()){
      const t=snap.data();
      ['red','cyan','green','gold'].forEach(k=>{
        if(t[k]){
          const pc=document.getElementById('tc-'+k);
          const ph=document.getElementById('th-'+k);
          if(pc) pc.value=t[k];
          if(ph) ph.value=t[k];
        }
      });
    }
  }catch(e){}
})();

/* ══ CATATAN ORDER ══ */
window.saveNote = async function(id, note){
  try{
    await updateDoc(doc(db,'orders',id),{note});
  }catch(e){ toast('❌ Gagal simpan catatan','warn'); }
};

/* ══ ACTIONS ══ */
window.setStatus = async function(id, status){
  const order = allOrders.find(o=>o.id===id);
  try{
    await updateDoc(doc(db,'orders',id), {status});
    toast(status==='done'?'✅ Selesai! WA terbuka...':'❌ Batal! WA terbuka...', status==='done'?'ok':'warn');

    if(order){
      const usn = order.usn||'-';
      const total = order.totalRb||0;
      const orderId = order.orderId||id.slice(-6).toUpperCase();
      let msg = '';
      if(status==='done'){
        msg = '✅ *ORDER SELESAI!*\n\nHalo *'+usn+'*, order kamu sudah kami proses!\n\n'
            + '*Order ID:* #'+orderId+'\n'
            + '*Total:* Rp '+total.toLocaleString('id-ID')+'.000\n\n'
            + 'Terima kasih sudah belanja di *KPC Store* 🏍️\n'
            + 'Jangan lupa kasih testimoni ya! 🌟';
      } else {
        msg = '❌ *ORDER DIBATALKAN*\n\nHalo *'+usn+'*, maaf order kamu dibatalkan.\n\n'
            + '*Order ID:* #'+orderId+'\n\n'
            + 'Jika ada pertanyaan silakan hubungi admin kembali 🙏';
      }
      // Buka WA dengan pesan siap kirim — admin tinggal forward ke pembeli
      const waNum = order.adminNomor||'6281252425581';
      setTimeout(()=>window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank'), 400);
    }
  }catch(e){ toast('❌ Gagal update!','warn'); }
};

window.delOrder = async function(id){
  if(!confirm('Hapus order ini dari database?')) return;
  try{
    await deleteDoc(doc(db,'orders',id));
    toast('🗑️ Order dihapus','ok');
  }catch(e){ toast('❌ Gagal hapus!','warn'); }
};

/* ══ TOAST ══ */
let tT;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);
}
window.toast = toast;

/* Enter key on lock */
document.getElementById('lockPass').addEventListener('keydown', e=>{
  if(e.key==='Enter') window.doUnlock();
});
</script>
