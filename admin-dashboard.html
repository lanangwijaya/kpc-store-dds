<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPC Store — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2244;--cyan:#00f0ff;--green:#00e676;--gold:#ffd600;--purple:#bf5fff;--bg:#03070d;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding:14px 14px 40px;}

/* BG */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
.bg-grad{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,100,255,.15),transparent 70%),radial-gradient(ellipse 60% 40% at 20% 80%,rgba(255,34,68,.1),transparent 60%),linear-gradient(180deg,#03070d 0%,#060f18 50%,#050d0a 100%);}

/* LOCK */
#lockScreen{position:fixed;inset:0;z-index:9999;background:rgba(3,7,13,.98);display:flex;align-items:center;justify-content:center;}
.lock-box{background:#060d18;border:1px solid rgba(0,240,255,.3);border-radius:20px;padding:32px 28px;width:90%;max-width:340px;}
.lock-icon{font-size:44px;text-align:center;display:block;margin-bottom:14px;}
.lock-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:2px;text-align:center;margin-bottom:4px;background:linear-gradient(90deg,#00f0ff,#bf5fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.lock-sub{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.3);text-align:center;margin-bottom:20px;}
.lock-inp-wrap{position:relative;margin-bottom:10px;}
.lock-inp{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(0,240,255,.25);border-radius:12px;padding:13px 44px 13px 16px;font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;outline:none;letter-spacing:5px;}
.lock-inp.err{border-color:rgba(255,34,68,.7);animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.lock-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:18px;padding:4px;}
.lock-err{font-family:'Orbitron',monospace;font-size:9px;color:var(--red);text-align:center;display:none;margin-bottom:8px;}
.lock-err.show{display:block;}
.lock-btn{width:100%;padding:13px;border:none;border-radius:12px;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#00f0ff,#bf5fff);color:#000;letter-spacing:1px;}

/* MAIN */
.main{position:relative;z-index:1;max-width:520px;margin:0 auto;}
.logout-btn{position:fixed;top:12px;right:12px;z-index:100;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid rgba(255,34,68,.3);background:rgba(255,34,68,.08);color:rgba(255,100,120,.7);cursor:pointer;letter-spacing:1px;}

/* HEADER */
.dash-header{text-align:center;padding:14px 0 18px;}
.dash-logo{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#ff2244,#ff6b00,#ffd600,#00e676,#00f0ff,#bf5fff,#ff2244);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gshift 8s linear infinite;}
@keyframes gshift{from{background-position:0% 50%;}to{background-position:300% 50%;}}
.dash-sub{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:4px;color:rgba(0,240,255,.5);margin-top:4px;}
.dash-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,240,255,.4),transparent);margin:10px 0 18px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:rgba(0,240,255,.05);border:1px solid rgba(0,240,255,.15);border-radius:14px;padding:12px 10px;text-align:center;}
.stat-card.red{background:rgba(255,34,68,.05);border-color:rgba(255,34,68,.2);}
.stat-card.green{background:rgba(0,230,118,.05);border-color:rgba(0,230,118,.2);}
.stat-num{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--cyan);}
.stat-card.red .stat-num{color:var(--red);}
.stat-card.green .stat-num{color:var(--green);}
.stat-lbl{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.3);margin-top:4px;}

/* SECTION BOXES */
.box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-bottom:14px;}
.box-cyan{border-color:rgba(0,240,255,.2);background:rgba(0,240,255,.03);}
.box-gold{border-color:rgba(255,214,0,.2);background:rgba(255,214,0,.03);}
.box-purple{border-color:rgba(191,95,255,.2);background:rgba(191,95,255,.03);}
.box-ttl{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;display:block;}
.box-cyan .box-ttl{color:rgba(0,240,255,.7);}
.box-gold .box-ttl{color:rgba(255,214,0,.7);}
.box-purple .box-ttl{color:rgba(191,95,255,.7);}

/* ANNOUNCE */
.ann-inp{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(0,240,255,.2);border-radius:10px;padding:9px 12px;font-family:'Rajdhani',sans-serif;font-size:13px;color:#fff;outline:none;resize:none;margin-bottom:8px;}
.ann-inp::placeholder{color:rgba(255,255,255,.2);}
.save-btn{width:100%;padding:10px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;cursor:pointer;letter-spacing:1px;}
.save-btn.cyan{background:rgba(0,240,255,.1);color:var(--cyan);border:1px solid rgba(0,240,255,.3);}
.save-btn.gold{background:rgba(255,214,0,.1);color:var(--gold);border:1px solid rgba(255,214,0,.3);}
.save-btn.purple{background:rgba(191,95,255,.1);color:var(--purple);border:1px solid rgba(191,95,255,.3);}
.reset-btn{width:100%;padding:7px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:8px;cursor:pointer;background:rgba(255,255,255,.04);color:rgba(255,255,255,.3);margin-top:6px;letter-spacing:1px;}

/* THEME */
.theme-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.tp{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;flex-shrink:0;}
.tp:hover,.tp.act{border-color:#fff;transform:scale(1.15);}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.color-row{display:flex;flex-direction:column;gap:3px;}
.color-lbl{font-family:'Orbitron',monospace;font-size:7px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.color-row-inp{display:flex;align-items:center;gap:6px;}
.cp{width:32px;height:28px;border:none;border-radius:6px;cursor:pointer;padding:0;}
.ch{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 8px;font-family:'Orbitron',monospace;font-size:9px;color:#fff;outline:none;}

/* LB EDITOR */
.lb-mode{display:flex;gap:8px;margin-bottom:10px;}
.lb-mode-btn{flex:1;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:7px;border-radius:10px;cursor:pointer;letter-spacing:.5px;border:1px solid;}
.lb-mode-btn.auto{color:var(--cyan);border-color:rgba(0,240,255,.3);background:rgba(0,240,255,.05);}
.lb-mode-btn.auto.act{background:rgba(0,240,255,.15);}
.lb-mode-btn.manual{color:var(--gold);border-color:rgba(255,214,0,.3);background:rgba(255,214,0,.05);}
.lb-mode-btn.manual.act{background:rgba(255,214,0,.15);}
.lb-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:280px;overflow-y:auto;}
.lb-row{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:7px 10px;}
.lb-rn{font-family:'Orbitron',monospace;font-size:11px;color:rgba(255,255,255,.3);width:20px;text-align:center;flex-shrink:0;}
.lb-ri{flex:1;background:transparent;border:none;color:#fff;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;}
.lb-rr{width:55px;background:transparent;border:none;color:var(--gold);font-family:'Orbitron',monospace;font-size:10px;outline:none;text-align:right;}
.lb-rd{background:none;border:none;color:rgba(255,34,68,.4);cursor:pointer;font-size:14px;flex-shrink:0;}

/* FILTER */
.filter-bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;padding:5px 12px;border-radius:20px;cursor:pointer;border:1px solid;background:none;letter-spacing:1px;}
.filter-btn.all{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.15);}
.filter-btn.all.act,.filter-btn.all:hover{background:rgba(255,255,255,.1);color:#fff;}
.filter-btn.pending{color:var(--gold);border-color:rgba(255,214,0,.3);}
.filter-btn.pending.act,.filter-btn.pending:hover{background:rgba(255,214,0,.12);}
.filter-btn.done{color:var(--green);border-color:rgba(0,230,118,.3);}
.filter-btn.done.act,.filter-btn.done:hover{background:rgba(0,230,118,.1);}
.filter-btn.cancel{color:var(--red);border-color:rgba(255,34,68,.3);}
.filter-btn.cancel.act,.filter-btn.cancel:hover{background:rgba(255,34,68,.1);}
.live-row{margin-left:auto;font-family:'Orbitron',monospace;font-size:8px;color:rgba(255,255,255,.25);display:flex;align-items:center;gap:5px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.7);}}

/* ORDER CARDS */
.order-list{display:flex;flex-direction:column;gap:10px;}
.order-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;position:relative;overflow:hidden;}
.order-card.pending{border-color:rgba(255,214,0,.25);background:rgba(255,214,0,.03);}
.order-card.done{border-color:rgba(0,230,118,.25);background:rgba(0,230,118,.03);}
.order-card.cancel{border-color:rgba(255,34,68,.2);opacity:.7;}
.order-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.order-card.pending::before{background:var(--gold);}
.order-card.done::before{background:var(--green);}
.order-card.cancel::before{background:var(--red);}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;}
.order-id{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;color:var(--cyan);}
.order-time{font-family:'Orbitron',monospace;font-size:7px;color:rgba(255,255,255,.28);}
.order-usn{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--purple);margin-top:1px;}
.sbadge{font-family:'Orbitron',monospace;font-size:7px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;letter-spacing:1px;}
.sbadge.pending{background:rgba(255,214,0,.15);color:var(--gold);border:1px solid rgba(255,214,0,.4);}
.sbadge.done{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.4);}
.sbadge.cancel{background:rgba(255,34,68,.12);color:#ff6680;border:1px solid rgba(255,34,68,.3);}
.order-items{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.oi-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.oi-row:last-child{border-bottom:none;}
.oi-tag{font-family:'Orbitron',monospace;font-size:7px;font-weight:700;padding:1px 5px;border-radius:10px;margin-right:5px;}
.oi-tag.gp{background:rgba(255,34,68,.15);color:var(--red);}
.oi-tag.cash{background:rgba(0,240,255,.12);color:var(--cyan);}
.oi-price{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--gold);}
.order-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.total-lbl{font-family:'Orbitron',monospace;font-size:7px;color:rgba(255,255,255,.3);}
.total-amt{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--green);}
.total-amt .curr{font-size:10px;vertical-align:super;color:rgba(255,255,255,.4);margin-right:1px;}
.order-admin{font-family:'Orbitron',monospace;font-size:8px;color:rgba(255,255,255,.3);text-align:right;}
.action-row{display:flex;gap:6px;margin-bottom:8px;}
.act-btn{flex:1;padding:7px 4px;border:none;border-radius:10px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;cursor:pointer;letter-spacing:.5px;}
.act-btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-done{background:linear-gradient(135deg,#00c853,#00e676);color:#003311;}
.btn-cancel{background:rgba(255,34,68,.15);color:#ff6680;border:1px solid rgba(255,34,68,.25);}
.btn-del{background:rgba(80,80,80,.2);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.1);}
.note-inp{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;font-family:'Rajdhani',sans-serif;font-size:12px;color:#fff;outline:none;resize:none;}
.note-inp::placeholder{color:rgba(255,255,255,.2);}
.empty-state{text-align:center;padding:40px 20px;font-family:'Orbitron',monospace;font-size:10px;color:rgba(255,255,255,.18);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);padding:9px 22px;border-radius:30px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap;}
.toast.warn{background:rgba(255,200,0,.97);color:#1a0d00;}
.toast.ok{background:rgba(0,230,118,.97);color:#003311;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <span class="lock-icon">🔐</span>
    <div class="lock-title">ADMIN DASHBOARD</div>
    <div class="lock-sub">KPC STORE</div>
    <div class="lock-inp-wrap">
      <input class="lock-inp" id="lockPass" type="password" placeholder="••••••••" autocomplete="off"/>
      <button class="lock-eye" id="lockEye" onclick="toggleEye()">👁</button>
    </div>
    <div class="lock-err" id="lockErr">⚠️ PASSWORD SALAH!</div>
    <button class="lock-btn" onclick="doLogin()">🔓 MASUK DASHBOARD</button>
  </div>
</div>

<button class="logout-btn" onclick="doLogout()">⏻ LOGOUT</button>
<div class="bg"><div class="bg-grad"></div></div>

<div class="main" id="mainDash" style="display:none;">
  <div class="dash-header">
    <div class="dash-logo">KPC</div>
    <div class="dash-sub">ADMIN DASHBOARD</div>
    <div class="dash-divider"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">TOTAL ORDER</div></div>
    <div class="stat-card red"><div class="stat-num" id="statPending">0</div><div class="stat-lbl">PENDING</div></div>
    <div class="stat-card green"><div class="stat-num" id="statDone">0</div><div class="stat-lbl">SELESAI</div></div>
  </div>

  <!-- PENGUMUMAN -->
  <div class="box box-cyan">
    <span class="box-ttl">📢 EDIT PENGUMUMAN TOKO</span>
    <textarea class="ann-inp" id="annInp" rows="2" placeholder="Tulis pengumuman..."></textarea>
    <button class="save-btn cyan" onclick="saveAnn()">💾 SIMPAN PENGUMUMAN</button>
  </div>

  <!-- TEMA WARNA -->
  <div class="box box-purple">
    <span class="box-ttl">🎨 GANTI TEMA WARNA TOKO</span>
    <div class="theme-presets">
      <div class="tp act" data-t="default" style="background:linear-gradient(135deg,#ff2244,#00f0ff)" onclick="pickPreset('default')" title="Default"></div>
      <div class="tp" data-t="sunset" style="background:linear-gradient(135deg,#ff6b00,#ffd600)" onclick="pickPreset('sunset')" title="Sunset"></div>
      <div class="tp" data-t="ocean" style="background:linear-gradient(135deg,#0066ff,#00e676)" onclick="pickPreset('ocean')" title="Ocean"></div>
      <div class="tp" data-t="sakura" style="background:linear-gradient(135deg,#ff69b4,#bf5fff)" onclick="pickPreset('sakura')" title="Sakura"></div>
      <div class="tp" data-t="toxic" style="background:linear-gradient(135deg,#00e676,#ffd600)" onclick="pickPreset('toxic')" title="Toxic"></div>
      <div class="tp" data-t="midnight" style="background:linear-gradient(135deg,#1a0533,#bf5fff)" onclick="pickPreset('midnight')" title="Midnight"></div>
    </div>
    <div class="theme-grid">
      <div class="color-row"><span class="color-lbl">MERAH</span><div class="color-row-inp"><input type="color" class="cp" id="cp-red" value="#ff2244" oninput="chSync('red',this.value)"/><input class="ch" id="ch-red" value="#ff2244" maxlength="7" oninput="cpSync('red',this.value)"/></div></div>
      <div class="color-row"><span class="color-lbl">CYAN</span><div class="color-row-inp"><input type="color" class="cp" id="cp-cyan" value="#00f0ff" oninput="chSync('cyan',this.value)"/><input class="ch" id="ch-cyan" value="#00f0ff" maxlength="7" oninput="cpSync('cyan',this.value)"/></div></div>
      <div class="color-row"><span class="color-lbl">HIJAU</span><div class="color-row-inp"><input type="color" class="cp" id="cp-green" value="#00e676" oninput="chSync('green',this.value)"/><input class="ch" id="ch-green" value="#00e676" maxlength="7" oninput="cpSync('green',this.value)"/></div></div>
      <div class="color-row"><span class="color-lbl">GOLD</span><div class="color-row-inp"><input type="color" class="cp" id="cp-gold" value="#ffd600" oninput="chSync('gold',this.value)"/><input class="ch" id="ch-gold" value="#ffd600" maxlength="7" oninput="cpSync('gold',this.value)"/></div></div>
    </div>
    <button class="save-btn purple" onclick="saveTheme()">🎨 TERAPKAN TEMA</button>
    <button class="reset-btn" onclick="pickPreset('default');saveTheme()">↺ RESET DEFAULT</button>
  </div>

  <!-- LEADERBOARD EDITOR -->
  <div class="box box-gold">
    <span class="box-ttl">🏆 ATUR TOP PEMBELI</span>
    <div class="lb-mode">
      <button class="lb-mode-btn auto act" id="lbAuto" onclick="setLbMode('auto')">🔄 AUTO</button>
      <button class="lb-mode-btn manual" id="lbManual" onclick="setLbMode('manual')">✏️ MANUAL</button>
    </div>
    <div class="lb-rows" id="lbRows"><div style="font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,255,255,.2);text-align:center;padding:10px">Loading...</div></div>
    <button class="save-btn gold" onclick="saveLb()">💾 SIMPAN</button>
    <button class="save-btn gold" style="margin-top:6px;" onclick="lbAddRow()">+ TAMBAH BARIS</button>
  </div>

  <!-- FILTER -->
  <div class="filter-bar">
    <button class="filter-btn all act" onclick="setFilter('all',this)">SEMUA</button>
    <button class="filter-btn pending" onclick="setFilter('pending',this)">⏳ PENDING</button>
    <button class="filter-btn done" onclick="setFilter('done',this)">✅ SELESAI</button>
    <button class="filter-btn cancel" onclick="setFilter('cancel',this)">❌ BATAL</button>
    <div class="live-row"><span class="live-dot"></span>LIVE</div>
  </div>

  <div class="order-list" id="orderList"><div class="empty-state">⏳ LOADING...</div></div>
</div>

<div class="toast" id="toast"></div>

<!-- REGULAR SCRIPT — untuk onclick handler -->
<script>
function toggleEye(){
  const i=document.getElementById('lockPass');
  const e=document.getElementById('lockEye');
  i.type=i.type==='password'?'text':'password';
  e.textContent=i.type==='password'?'👁':'🙈';
}
function doLogin(){
  const v=document.getElementById('lockPass').value;
  const err=document.getElementById('lockErr');
  if(v==='kpc2025'){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('mainDash').style.display='block';
    if(window._initDash) window._initDash();
  } else {
    const inp=document.getElementById('lockPass');
    inp.classList.add('err');
    err.classList.add('show');
    inp.value='';
    setTimeout(()=>{inp.classList.remove('err');err.classList.remove('show');},1500);
  }
}
function doLogout(){
  document.getElementById('mainDash').style.display='none';
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('lockPass').value='';
  if(window._unsubDash) window._unsubDash();
}
document.getElementById('lockPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// Theme + LB functions accessible from onclick
function chSync(k,v){const el=document.getElementById('ch-'+k);if(el)el.value=v;}
function cpSync(k,v){if(/^#[0-9a-fA-F]{6}$/.test(v)){const el=document.getElementById('cp-'+k);if(el)el.value=v;}}

const PRESETS={
  default:{red:'#ff2244',cyan:'#00f0ff',green:'#00e676',gold:'#ffd600'},
  sunset:{red:'#ff6b00',cyan:'#ffd600',green:'#ffaa00',gold:'#ff4400'},
  ocean:{red:'#0066ff',cyan:'#00cfff',green:'#00e676',gold:'#00b4ff'},
  sakura:{red:'#ff69b4',cyan:'#ffb3d9',green:'#ff85c2',gold:'#ffaadd'},
  toxic:{red:'#aaff00',cyan:'#00e676',green:'#ccff33',gold:'#ffd600'},
  midnight:{red:'#bf5fff',cyan:'#9933ff',green:'#cc66ff',gold:'#bf5fff'},
};
function pickPreset(name){
  const t=PRESETS[name];if(!t)return;
  document.querySelectorAll('.tp').forEach(el=>el.classList.toggle('act',el.dataset.t===name));
  Object.keys(t).forEach(k=>{
    const cp=document.getElementById('cp-'+k);
    const ch=document.getElementById('ch-'+k);
    if(cp)cp.value=t[k];if(ch)ch.value=t[k];
  });
}

window.lbMode='auto';
window.lbData=[];
function setLbMode(m){
  window.lbMode=m;
  document.getElementById('lbAuto').classList.toggle('act',m==='auto');
  document.getElementById('lbManual').classList.toggle('act',m==='manual');
  if(m==='auto'&&window._loadLbAuto) window._loadLbAuto();
  else renderLbRows();
}
function renderLbRows(){
  const c=document.getElementById('lbRows');if(!c)return;
  c.innerHTML='';
  if(!window.lbData.length){c.innerHTML='<div style="font-family:\'Orbitron\',monospace;font-size:9px;color:rgba(255,255,255,.2);text-align:center;padding:10px">Kosong</div>';return;}
  window.lbData.forEach((item,i)=>{
    const row=document.createElement('div');row.className='lb-row';
    row.innerHTML='<span class="lb-rn">'+(i+1)+'</span>'+
      '<input class="lb-ri" value="'+(item.usn||'')+'" placeholder="Username..." oninput="window.lbData['+i+'].usn=this.value"/>'+
      '<input class="lb-rr" type="number" value="'+(item.totalRb||0)+'" oninput="window.lbData['+i+'].totalRb=+this.value"/>'+
      '<span style="font-family:\'Orbitron\',monospace;font-size:8px;color:rgba(255,255,255,.3)">rb</span>'+
      '<button class="lb-rd" onclick="window.lbData.splice('+i+',1);renderLbRows()">🗑</button>';
    c.appendChild(row);
  });
}
function lbAddRow(){window.lbData.push({usn:'',totalRb:0});renderLbRows();}
function setFilter(f,btn){
  window._curFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act');
  if(window._renderOrders) window._renderOrders();
}
</script>

<!-- MODULE SCRIPT — Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, deleteDoc, setDoc, getDoc, query, orderBy, onSnapshot, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyC8iPr3Ww5K9NLUtOmytto0sKjWu8Zr28o",
  authDomain:"testimoni-33abd.firebaseapp.com",
  projectId:"testimoni-33abd",
  storageBucket:"testimoni-33abd.firebasestorage.app",
  messagingSenderId:"499376066418",
  appId:"1:499376066418:web:a082972e7c4f70f64657eb"
});
const db = getFirestore(app);
const orderCol = collection(db, "orders");

let allOrders=[], unsub=null;
window._curFilter='all';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let tT;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);
}

// RENDER ORDERS
window._renderOrders = function(){
  const list=document.getElementById('orderList');
  list.innerHTML='';
  const f=window._curFilter;
  const filtered=f==='all'?allOrders:allOrders.filter(o=>o.status===f);
  if(!filtered.length){list.innerHTML='<div class="empty-state">📭 TIDAK ADA ORDER</div>';return;}
  filtered.forEach((order,idx)=>{
    const card=document.createElement('div');
    card.className='order-card '+(order.status||'pending');
    card.style.animationDelay=(idx*.05)+'s';
    const items=order.items||[];
    const isDone=order.status==='done',isCancel=order.status==='cancel';
    const sLabel=isDone?'✅ SELESAI':isCancel?'❌ BATAL':'⏳ PENDING';
    const itemsHtml=items.map(it=>
      '<div class="oi-row">'+
        '<span><span class="oi-tag '+(it.panel==='gp'?'gp':'cash')+'">'+(it.panel==='gp'?'GP':'CASH')+'</span>'+esc(it.nama)+' x'+(it.qty||1)+'</span>'+
        '<span class="oi-price">'+((it.harga||0)*(it.qty||1))+'rb</span>'+
      '</div>').join('');
    card.innerHTML=
      '<div class="order-top"><div>'+
        '<div class="order-id">🧾 #'+esc(order.orderId||order.id.slice(-6).toUpperCase())+'</div>'+
        '<div class="order-time">🕐 '+esc(order.tStr||'-')+'</div>'+
        '<div class="order-usn">🎮 '+esc(order.usn||'-')+'</div>'+
        (order.buyerWa?'<div class="order-time">📱 '+esc(order.buyerWa)+'</div>':'')+
        (order.buyerLocation&&order.buyerLocation.city!=='-'?
          '<div class="order-time">📍 '+(order.buyerLocation.flag||'')+' '+esc(order.buyerLocation.city)+', '+esc(order.buyerLocation.region)+', '+esc(order.buyerLocation.country)+'</div>':'')+
      '</div><span class="sbadge '+(order.status||'pending')+'">'+sLabel+'</span></div>'+
      '<div class="order-items">'+itemsHtml+'</div>'+
      '<div class="order-footer">'+
        '<div><div class="total-lbl">TOTAL SEHARUSNYA</div>'+
        '<div class="total-amt"><span class="curr">Rp</span>'+(order.totalRb||0).toLocaleString('id-ID')+'.000</div></div>'+
        '<div class="order-admin">Admin<br>'+esc(order.admin||'-')+'</div>'+
      '</div>'+
      '<div class="action-row">'+
        '<button class="act-btn btn-done" '+(isDone?'disabled':'')+' onclick="window._setStatus(\''+order.id+'\',\'done\')">✅ SELESAI</button>'+
        '<button class="act-btn btn-cancel" '+(isCancel?'disabled':'')+' onclick="window._setStatus(\''+order.id+'\',\'cancel\')">❌ BATAL</button>'+
        '<button class="act-btn btn-del" onclick="window._delOrder(\''+order.id+'\')">🗑</button>'+
      '</div>'+
      '<textarea class="note-inp" rows="1" placeholder="📝 Catatan admin..." onchange="window._saveNote(\''+order.id+'\',this.value)">'+esc(order.note||'')+'</textarea>';
    list.appendChild(card);
  });
};

// INIT DASHBOARD (dipanggil setelah login)
window._initDash = async function(){
  // Load orders
  const q=query(orderCol,orderBy("createdAt","desc"));
  unsub=onSnapshot(q,snap=>{
    allOrders=[];
    snap.forEach(d=>allOrders.push({id:d.id,...d.data()}));
    document.getElementById('statTotal').textContent=allOrders.length;
    document.getElementById('statPending').textContent=allOrders.filter(o=>o.status==='pending').length;
    document.getElementById('statDone').textContent=allOrders.filter(o=>o.status==='done').length;
    window._renderOrders();
    window._loadLbAuto();
  });
  window._unsubDash=()=>{if(unsub)unsub();};

  // Load announce
  try{
    const s=await getDoc(doc(db,'config','announcement'));
    if(s.exists()){const el=document.getElementById('annInp');if(el)el.value=s.data().text||'';}
  }catch(e){}

  // Load theme
  try{
    const s=await getDoc(doc(db,'config','theme'));
    if(s.exists()){
      const t=s.data();
      ['red','cyan','green','gold'].forEach(k=>{
        if(t[k]){
          const cp=document.getElementById('cp-'+k);
          const ch=document.getElementById('ch-'+k);
          if(cp)cp.value=t[k];if(ch)ch.value=t[k];
        }
      });
    }
  }catch(e){}

  // Load lb config
  try{
    const s=await getDoc(doc(db,'config','leaderboard'));
    if(s.exists()){
      const d=s.data();
      window.lbMode=d.mode||'auto';
      window.lbData=d.data||[];
      document.getElementById('lbAuto').classList.toggle('act',window.lbMode==='auto');
      document.getElementById('lbManual').classList.toggle('act',window.lbMode==='manual');
      if(window.lbMode==='manual') renderLbRows();
    }
  }catch(e){}
};

window._loadLbAuto=function(){
  if(window.lbMode!=='auto')return;
  const map={};
  allOrders.forEach(o=>{
    if(!o.usn||o.status!=='done')return;
    const k=o.usn.toLowerCase();
    if(!map[k])map[k]={usn:o.usn,totalRb:0,count:0};
    map[k].totalRb+=(o.totalRb||0);map[k].count++;
  });
  window.lbData=Object.values(map).sort((a,b)=>b.totalRb-a.totalRb).slice(0,10);
  renderLbRows();
};

// ACTIONS
window._setStatus=async function(id,status){
  const order=allOrders.find(o=>o.id===id);
  try{
    await updateDoc(doc(db,'orders',id),{status});
    toast(status==='done'?'✅ Selesai! WA terbuka...':'❌ Batal! WA terbuka...',status==='done'?'ok':'warn');
    if(order){
      const usn=order.usn||'-',total=order.totalRb||0,oid=order.orderId||id.slice(-6).toUpperCase();
      const msg=status==='done'
        ?'✅ *ORDER SELESAI!*\n\nHalo *'+usn+'*, order kamu sudah diproses!\n\n*Order ID:* #'+oid+'\n*Total:* Rp '+total.toLocaleString('id-ID')+'.000\n\nTerima kasih belanja di *KPC Store* 🏍️\nJangan lupa kasih testimoni ya! 🌟'
        :'❌ *ORDER DIBATALKAN*\n\nHalo *'+usn+'*, maaf order kamu dibatalkan.\n\n*Order ID:* #'+oid+'\n\nHubungi admin untuk info lebih lanjut 🙏';
      const targetWa = order.buyerWa || order.adminNomor || '6281252425581';
      setTimeout(()=>window.open('https://wa.me/'+targetWa+'?text='+encodeURIComponent(msg),'_blank'),400);
    }
  }catch(e){toast('❌ Gagal update!','warn');}
};

window._delOrder=async function(id){
  if(!confirm('Hapus order ini?'))return;
  try{await deleteDoc(doc(db,'orders',id));toast('🗑️ Dihapus','ok');}
  catch(e){toast('❌ Gagal hapus!','warn');}
};

window._saveNote=async function(id,note){
  try{await updateDoc(doc(db,'orders',id),{note});}
  catch(e){toast('❌ Gagal simpan catatan','warn');}
};

// ANNOUNCE
window.saveAnn=async function(){
  const text=document.getElementById('annInp')?.value?.trim();
  if(!text){toast('⚠️ Isi pengumuman dulu!','warn');return;}
  try{await setDoc(doc(db,'config','announcement'),{text});toast('✅ Pengumuman disimpan!','ok');}
  catch(e){toast('❌ Gagal: '+e.message,'warn');}
};

// THEME
window.saveTheme=async function(){
  const t={};
  ['red','cyan','green','gold'].forEach(k=>{const v=document.getElementById('ch-'+k)?.value;if(v)t[k]=v;});
  try{await setDoc(doc(db,'config','theme'),t);toast('🎨 Tema diterapkan!','ok');}
  catch(e){toast('❌ Gagal: '+e.message,'warn');}
};

// LEADERBOARD
window.saveLb=async function(){
  try{
    await setDoc(doc(db,'config','leaderboard'),{mode:window.lbMode,data:window.lbData});
    toast('✅ Leaderboard disimpan!','ok');
  }catch(e){toast('❌ Gagal: '+e.message,'warn');}
};
</script>
</body>
</html>
